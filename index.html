<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16835B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GharKhoj">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>GharKhoj</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8faf9;color:#17201d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app{max-width:760px;margin:auto;padding:20px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}
    .brand{font-size:25px;font-weight:900;color:#16835b}.tag{font-size:12px;color:#6b7280;margin-top:2px}
    .avatar{width:44px;height:44px;border-radius:50%;background:#ddf4e9;color:#16835b;display:grid;place-items:center;font-weight:800}
    .location,.search{background:#fff;border:1px solid #e6ece9;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .location span:nth-child(2){flex:1;font-weight:700}.search input{border:0;outline:0;flex:1;font-size:15px}
    .seg{display:flex;background:#e9f0ed;border-radius:13px;padding:4px}.seg button{flex:1;border:0;padding:12px;border-radius:10px;background:transparent;font-weight:800;color:#64716c}.seg .on{background:#16835b;color:#fff}
    h2{font-size:18px;margin:25px 0 13px}.cats{display:flex;gap:10px;overflow:auto}.cat{min-width:92px;background:#fff;border:1px solid #e8eeeb;border-radius:16px;padding:14px 8px;text-align:center}.cat .ico{font-size:27px;margin-bottom:5px}.cat b{font-size:12px}
    .section{display:flex;justify-content:space-between;align-items:center}.section h2{margin-bottom:13px}.see{color:#16835b;font-weight:800;font-size:13px}
    .card{background:#fff;border:1px solid #e8eeeb;border-radius:20px;overflow:hidden;margin-bottom:15px;box-shadow:0 2px 8px #00000006}.photo{height:205px;background-size:cover;background-position:center;position:relative}
    .badge,.heart{position:absolute;background:#fff;border-radius:10px;padding:7px 10px;font-weight:800}.badge{left:12px;top:12px;color:#16835b;font-size:11px}.heart{right:12px;top:12px;font-size:20px;padding:5px 9px}
    .body{padding:15px}.price{font-size:18px;font-weight:900;color:#16835b}.title{font-weight:850;font-size:16px;margin:5px 0 8px}.meta{color:#6b7280;font-size:12px;margin:4px 0}
    .nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid #e6ece9;display:flex;justify-content:center;gap:24px;padding:10px 8px env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#8b9691;font-weight:700;font-size:10px}.nav .active{color:#16835b}.nav span{display:block;font-size:21px;margin-bottom:2px}
    .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#17201d;color:#fff;padding:11px 15px;border-radius:12px;display:none;font-size:13px}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">🏠 GharKhoj</div><div class="tag">Find a place you'll call home.</div></div><div class="avatar">GK</div></div>
  <div class="location"><span>📍</span><span>Kathmandu, Nepal</span><span>⌄</span></div>
  <div class="search"><span>🔎</span><input id="q" placeholder="Search houses, land, apartments..."><span>☷</span></div>
  <div class="seg"><button id="buy" class="on" onclick="mode('buy')">BUY</button><button id="rent" onclick="mode('rent')">RENT</button></div>

  <div class="section"><h2>Categories</h2><span class="see">See all ›</span></div>
  <div class="cats">
    <div class="cat" onclick="filterType('House')"><div class="ico">🏠</div><b>Houses</b></div>
    <div class="cat" onclick="filterType('Apartment')"><div class="ico">🏢</div><b>Apartments</b></div>
    <div class="cat" onclick="filterType('Land')"><div class="ico">🌳</div><b>Land</b></div>
    <div class="cat" onclick="filterType('Commercial')"><div class="ico">🏬</div><b>Commercial</b></div>
  </div>

  <div class="section"><h2>Featured Properties</h2><span class="see">View all</span></div>
  <div id="list"></div>

  <div class="section"><h2>Recently Added</h2></div>
</div>

<div class="nav">
  <button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>Home</button>
  <button onclick="document.getElementById('q').focus()"><span>⌕</span>Search</button>
  <button onclick="toast('Property posting will be available soon')"><span>＋</span>Post</button>
  <button onclick="toast('Saved properties will be available soon')"><span>♡</span>Saved</button>
  <button onclick="toast('Profile will be available soon')"><span>♙</span>Profile</button>
</div>
<div id="toast" class="toast"></div>

<script>
const properties=[
 {type:"House",title:"Modern 4 BHK House",location:"Budhanilkantha, Kathmandu",price:"Rs. 2,50,00,000",meta:"4 Beds • 3 Baths • 2,850 sq.ft.",img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80"},
 {type:"Apartment",title:"2 BHK Apartment",location:"Dhumbarahi, Kathmandu",price:"Rs. 55,000 / month",meta:"2 Beds • 2 Baths • 1,250 sq.ft.",img:"https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1000&q=80"},
 {type:"Land",title:"Residential Land",location:"Imadol, Lalitpur",price:"Rs. 18,00,000 / aana",meta:"4 aana • Residential • Road access",img:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1000&q=80"}
];
function render(items=properties){document.getElementById("list").innerHTML=items.map((p,i)=>`<div class="card" onclick="details(${i})"><div class="photo" style="background-image:url('${p.img}')"><span class="badge">${p.type}</span><span class="heart">♡</span></div><div class="body"><div class="price">${p.price}</div><div class="title">${p.title}</div><div class="meta">📍 ${p.location}</div><div class="meta">${p.meta}</div></div></div>`).join("")}
function mode(x){document.getElementById("buy").classList.toggle("on",x==="buy");document.getElementById("rent").classList.toggle("on",x==="rent");toast(x==="buy"?"Showing properties for sale":"Showing rental properties")}
function filterType(t){render(properties.filter(p=>p.type===t));document.getElementById("list").scrollIntoView({behavior:"smooth"})}
function details(i){const p=properties[i];alert(`${p.title}\n\n${p.price}\n${p.location}\n\n${p.meta}\n\nGharKhoj property details screen will be connected in the next version.`)}
document.getElementById("q").addEventListener("input",e=>{const q=e.target.value.toLowerCase();render(properties.filter(p=>(p.title+p.location+p.type).toLowerCase().includes(q)))});
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
render();
</script>
</body>
</html>
